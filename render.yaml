services:
  - type: web
    name: fleetflow-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Email Configuration (MUST BE SET MANUALLY IN RENDER DASHBOARD)
      # 1. Set EMAIL_SERVICE to: gmail
      # 2. Set EMAIL_USER to your Gmail address
      # 3. Set EMAIL_PASSWORD to your Gmail App-Specific Password (get from https://myaccount.google.com/apppasswords)
      # App-Specific Passwords are 16 characters with spaces (e.g., xxxx xxxx xxxx xxxx) - paste the entire string including spaces
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: PASSWORD_RESET_EXPIRY
        value: "24"
      - key: SESSION_DURATION_HOURS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: PAGINATION_DEFAULT_LIMIT
        value: "10"
      - key: PAGINATION_MAX_LIMIT
        value: "100"

  - type: web
    name: fleetflow-client
    env: static
    rootDir: client
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
